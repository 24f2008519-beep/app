
<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">

    
    
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="mb-4">Admin Dashboard</h1>
        <h4>Pending Examiner Approvals</h4>

        {% if pending_examiners %}
            <div class="table-responsive mt-3">
                <table class="table table-bordered table-striped bg-white">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for examiner in pending_examiners %}
                            <tr>
                                <td>{{ examiner.username }}</td>
                                <td>{{ examiner.email }}</td>
                                <td>
                                    <form
                                        method="POST"
                                        action="{{ url_for('main.approve_examiner', examiner_id=examiner.id) }}"
                                    >
                                        <button class="btn btn-success btn-sm" type="submit">
                                            Approve
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        {% else %}
            <p class="text-muted mt-3">No pending examiner approvals.</p>
        {% endif %}

        <a href="{{ url_for('main.logout') }}" class="btn btn-outline-secondary mt-3">
            Logout
        </a>
    </div>
</body>
</html>
